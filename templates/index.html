
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Smart Movie Recommendation System</title>

<link rel="stylesheet"
      href="/static/style.css">

</head>


<body>

<div class="container">

    <header>

        <h1>
            🎬 Smart Movie Recommendation System
        </h1>

        <p>
            Discover movies based on your favorite movie,
            mood, genre, and content similarity 🤖🍿
        </p>

    </header>


    <!-- =====================================================
         MOVIE RECOMMENDATION
         ===================================================== -->

    <section class="card">

        <h2>🎥 Find Similar Movies</h2>

        <p class="description">
            Enter a movie you like and get movies
            with similar content.
        </p>

        <div class="form-row">

            <input
                id="movieInput"
                type="text"
                placeholder="Example: Toy Story"
            >

            <select id="recommendCount">

                <option value="5">5 Movies</option>
                <option value="10" selected>10 Movies</option>
                <option value="15">15 Movies</option>

            </select>

            <button onclick="recommendMovies()">
                Recommend
            </button>

        </div>

        <div id="recommendStatus"></div>

        <div id="recommendResults"
             class="movie-grid">
        </div>

    </section>


    <!-- =====================================================
         MOOD RECOMMENDATION
         ===================================================== -->

    <section class="card">

        <h2>😊 Find Movies By Mood</h2>

        <div class="filters">

            <div>

                <label>Mood</label>

                <input
                    id="moodInput"
                    type="text"
                    placeholder="Comedy, romantic, scary..."
                >

            </div>


            <div>

                <label>Genre</label>

                <select id="genreInput">

                    <option>All Genres</option>
                    <option>Action</option>
                    <option>Adventure</option>
                    <option>Animation</option>
                    <option>Comedy</option>
                    <option>Crime</option>
                    <option>Documentary</option>
                    <option>Drama</option>
                    <option>Family</option>
                    <option>Fantasy</option>
                    <option>History</option>
                    <option>Horror</option>
                    <option>Music</option>
                    <option>Mystery</option>
                    <option>Romance</option>
                    <option>Science Fiction</option>
                    <option>Thriller</option>
                    <option>War</option>

                </select>

            </div>


            <div>

                <label>Minimum Rating</label>

                <select id="ratingInput">

                    <option value="5">5.0</option>
                    <option value="6" selected>6.0</option>
                    <option value="7">7.0</option>
                    <option value="8">8.0</option>
                    <option value="9">9.0</option>

                </select>

            </div>


            <div>

                <label>Number of Movies</label>

                <select id="moodCount">

                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="15">15</option>

                </select>

            </div>

        </div>


        <button onclick="moodRecommendations()">
            Find Movies
        </button>


        <div id="moodResults"
             class="movie-grid">
        </div>

    </section>


    <!-- =====================================================
         SEARCH
         ===================================================== -->

    <section class="card">

        <h2>🔎 Search Movies</h2>

        <div class="form-row">

            <input
                id="searchInput"
                type="text"
                placeholder="Search movie name"
            >

            <select id="yearInput">

                <option>All Years</option>

            </select>

            <button onclick="searchMovies()">
                Search
            </button>

        </div>

        <div id="searchStatus"></div>

        <div id="searchResults"
             class="movie-grid">
        </div>

    </section>


</div>


<script>

function createMovieCard(movie) {

    let poster = movie.poster;

    if (!poster) {
        poster =
        "https://via.placeholder.com/300x450?text=No+Poster";
    }

    let similarityHTML = "";

    if (movie.similarity !== null &&
        movie.similarity !== undefined) {

        similarityHTML = `
            <div class="similarity">
                Similarity: ${movie.similarity}%
            </div>
        `;
    }

    return `

        <div class="movie-card">

            <img
                src="${poster}"
                alt="${movie.title}"
                onerror="this.src='https://via.placeholder.com/300x450?text=No+Poster'"
            >

            <div class="movie-content">

                <h3>
                    ${movie.title}
                </h3>

                <p class="year">
                    ${movie.year || "Year unavailable"}
                </p>

                <p>
                    ⭐ Rating: ${movie.rating}
                </p>

                <p>
                    🎭 ${movie.genres || "Genre unavailable"}
                </p>

                <p>
                    👥 ${movie.cast || "Cast unavailable"}
                </p>

                ${similarityHTML}

                <p class="overview">
                    ${movie.overview || "No overview available."}
                </p>

                ${
                    movie.explanation
                    ?
                    `<p class="explanation">
                        💡 ${movie.explanation}
                    </p>`
                    :
                    ""
                }

            </div>

        </div>

    `;
}


async function recommendMovies() {

    const title =
        document.getElementById("movieInput").value;

    const count =
        document.getElementById("recommendCount").value;

    const status =
        document.getElementById("recommendStatus");

    const results =
        document.getElementById("recommendResults");

    if (!title.trim()) {

        status.innerHTML =
            "<p class='error'>Please enter a movie name.</p>";

        return;
    }

    status.innerHTML =
        "<p class='loading'>Finding recommendations...</p>";

    results.innerHTML = "";

    try {

        const response =
            await fetch("/api/recommend", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: title,
                    count: count
                })

            });

        const data =
            await response.json();

        if (!data.success) {

            status.innerHTML =
                `<p class="error">${data.message}</p>`;

            return;
        }

        status.innerHTML =
            `<h3>Recommended Movies 🍿</h3>`;

        results.innerHTML =
            data.results
                .map(createMovieCard)
                .join("");

    }

    catch (error) {

        status.innerHTML =
            "<p class='error'>Something went wrong. Please try again.</p>";

    }

}


async function moodRecommendations() {

    const mood =
        document.getElementById("moodInput").value;

    const genre =
        document.getElementById("genreInput").value;

    const rating =
        document.getElementById("ratingInput").value;

    const count =
        document.getElementById("moodCount").value;

    const results =
        document.getElementById("moodResults");

    results.innerHTML =
        "<p class='loading'>Finding movies...</p>";

    try {

        const response =
            await fetch("/api/mood", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    mood: mood,
                    genre: genre,
                    rating: rating,
                    count: count

                })

            });

        const data =
            await response.json();

        if (!data.results.length) {

            results.innerHTML =
                "<p class='error'>No matching movies found.</p>";

            return;
        }

        results.innerHTML =
            data.results
                .map(createMovieCard)
                .join("");

    }

    catch (error) {

        results.innerHTML =
            "<p class='error'>Something went wrong.</p>";

    }

}


async function searchMovies() {

    const query =
        document.getElementById("searchInput").value;

    const year =
        document.getElementById("yearInput").value;

    const status =
        document.getElementById("searchStatus");

    const results =
        document.getElementById("searchResults");

    status.innerHTML =
        "<p class='loading'>Searching...</p>";

    results.innerHTML = "";

    try {

        const response =
            await fetch("/api/search", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: query,
                    year: year
                })

            });

        const data =
            await response.json();

        if (!data.success) {

            status.innerHTML =
                `<p class="error">${data.message}</p>`;

            return;
        }

        status.innerHTML =
            "<h3>Search Results</h3>";

        results.innerHTML =
            data.results
                .map(createMovieCard)
                .join("");

    }

    catch (error) {

        status.innerHTML =
            "<p class='error'>Something went wrong.</p>";

    }

}


/* Generate years */

const yearSelect =
    document.getElementById("yearInput");

for (
    let year = 2026;
    year >= 1900;
    year--
) {

    const option =
        document.createElement("option");

    option.value = year;
    option.textContent = year;

    yearSelect.appendChild(option);
}

</script>

</body>

</html>
